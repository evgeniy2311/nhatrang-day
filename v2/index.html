<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06283D">
<title>Нячанг: день драйва</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* One phone column. Home: cover → "now" banner → route switcher → day timeline → tools.
   Each stop opens as a full-screen sheet with swipeable photos and a sticky "Навигатор / Дальше" dock. */
:root {
  --bg: #F4EFE6; --surface: #FFFFFF; --ink: #062B3A; --muted: #4F6873; --line: #E2D9C8;
  --sea: #0A8296; --sea-soft: #D6F0F2;
  --sun: #E2560B; --sun-soft: #FFE6D3;
  --dusk: #5B47D6; --dusk-soft: #E8E4FD;
  --leaf: #2F8A4E; --leaf-soft: #DDF2E2;
  --warn-bg: #FFF1DF; --warn-ink: #93380A;
  --shadow: 0 8px 28px rgba(6,43,58,.14);
  --f-d: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-b: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08171E; --surface: #10252E; --ink: #E9F4F6; --muted: #9AB3BB; --line: #21404B;
  --sea: #35C3D6; --sea-soft: #0F3640; --sun: #FF8A3D; --sun-soft: #3B2416; --dusk: #A196FF; --dusk-soft: #25214B;
  --leaf: #5BD07F; --leaf-soft: #133523; --warn-bg: #3A2614; --warn-ink: #FFC189; --shadow: 0 8px 28px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #08171E; --surface: #10252E; --ink: #E9F4F6; --muted: #9AB3BB; --line: #21404B;
  --sea: #35C3D6; --sea-soft: #0F3640; --sun: #FF8A3D; --sun-soft: #3B2416; --dusk: #A196FF; --dusk-soft: #25214B;
  --leaf: #5BD07F; --leaf-soft: #133523; --warn-bg: #3A2614; --warn-ink: #FFC189; --shadow: 0 8px 28px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-b); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-d); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.ic { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }

/* cover */
.cover { position: relative; min-height: min(78vh, 640px); color: #fff; background: #06283D; overflow: hidden; display: flex; align-items: flex-end; }
.cover .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); }
@media (prefers-reduced-motion: no-preference) { .cover .bg { animation: drift 18s ease-in-out infinite alternate; } @keyframes drift { to { transform: scale(1.12) translate(-1.5%, -1%); } } }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,22,32,.25) 0%, rgba(3,22,32,.1) 30%, rgba(3,22,32,.7) 70%, rgba(3,22,32,.96) 100%); }
.cover .in { position: relative; z-index: 1; padding-block: 90px 34px; display: flex; flex-direction: column; gap: 14px; width: 100%; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 7px 12px; border-radius: 999px; }
.cover h1 { font-size: clamp(34px, 10vw, 50px); line-height: 1; font-weight: 800; }
.cover h1 em { font-style: normal; background: linear-gradient(90deg, #FFB36B, #FF6A3D 60%, #FF4F8B); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cover p { margin: 0; font-size: 17px; opacity: .92; max-width: 32ch; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 9px 4px; text-align: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.stats b { display: block; font-family: var(--f-d); font-size: 16px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; opacity: .85; }

/* now banner */
.now { position: sticky; top: 0; z-index: 15; margin-top: -18px; }
.now .card { background: var(--ink); color: var(--bg); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.now .lbl { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .75; display: flex; align-items: center; gap: 8px; }
.now .lbl i { width: 8px; height: 8px; border-radius: 50%; background: #FF8A3D; box-shadow: 0 0 0 4px rgba(255,138,61,.3); }
@media (prefers-reduced-motion: no-preference) { .now .lbl i { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,138,61,.08); } } }
.now h2 { font-size: 18px; line-height: 1.2; }
.now p { margin: 0; font-size: 14px; opacity: .8; }
.now .row .btn { min-height: 46px; }
.bar { height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; background: #FF8A3D; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 16px; border-radius: 16px; font-weight: 800; font-size: 16px; text-decoration: none; border: 0; cursor: pointer; }
.btn.go { background: var(--sun); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.16); }
.btn.soft { background: rgba(255,255,255,.14); color: inherit; }
.btn.line { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 130px; }
.row > .btn.go { flex: 2 1 170px; }

/* sections */
.sec { padding-block: 30px 4px; display: flex; flex-direction: column; gap: 12px; }
.sec h2 { font-size: 22px; }
.hint { margin: -4px 0 0; color: var(--muted); font-size: 14px; }

/* route switcher */
.routes { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 4px 16px 10px; scrollbar-width: none; }
.routes::-webkit-scrollbar { display: none; }
.rcard { flex: 0 0 78%; max-width: 330px; scroll-snap-align: start; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; }
.rcard[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.rcard .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.rcard b { font-family: var(--f-d); font-size: 17px; line-height: 1.15; }
.rcard p { margin: 0; color: var(--muted); font-size: 14px; }
.rcard .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--leaf-soft); border-color: transparent; color: var(--leaf); }
.chip.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn-ink); }
.best { position: absolute; top: -9px; right: 12px; background: var(--sun); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: .04em; }

/* battery meter */
.batt { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.batt .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.batt .top b { font-family: var(--f-d); font-size: 18px; font-variant-numeric: tabular-nums; }
.meter { position: relative; height: 14px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.meter b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--leaf), var(--c)); border-radius: 7px; }
.meter i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--warn-ink); }
.batt small { color: var(--muted); font-size: 12px; }

/* timeline */
.rail { position: relative; display: flex; flex-direction: column; padding-left: 22px; }
.rail::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: 20px; width: 4px; border-radius: 2px; background: linear-gradient(180deg, var(--sea), var(--sun) 55%, var(--dusk)); }
.ride { font-size: 13px; color: var(--muted); padding: 7px 0 7px 6px; display: flex; gap: 6px; align-items: center; font-weight: 600; }
.item { position: relative; display: grid; grid-template-columns: 50px 60px 1fr; gap: 12px; align-items: center; text-decoration: none; background: var(--surface); border-radius: 18px; padding: 10px 12px 10px 10px; border: 1px solid var(--line); min-height: 72px; cursor: pointer; }
.item::before { content: ""; position: absolute; left: -20px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--c); border: 3px solid var(--bg); }
.item .t { font-family: var(--f-d); font-weight: 700; font-size: 15px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.item .t small { display: block; font-family: var(--f-b); font-weight: 700; font-size: 12px; color: var(--muted); margin-top: 3px; }
.item .n { display: flex; flex-direction: column; min-width: 0; }
.item .n b { font-size: 16px; line-height: 1.2; }
.item .n span { font-size: 13px; color: var(--muted); }
.thumb { width: 60px; height: 60px; border-radius: 15px; overflow: hidden; position: relative; background: var(--c); display: grid; place-items: center; color: #fff; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.num { position: absolute; left: -3px; bottom: -3px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-d); font-weight: 700; font-size: 11px; color: #fff; background: var(--c); border: 2px solid var(--surface); }
.item.cur { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); }
.item.done { opacity: .55; }
.home-row { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.home-row .t small, .home-row .n span { color: inherit; opacity: .75; }

/* tools */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; min-height: 110px; cursor: pointer; }
.tool b { font-size: 16px; }
.tool span { font-size: 13px; color: var(--muted); }
.tool .ic { width: 26px; height: 26px; color: var(--sea); }
.tool.wide { grid-column: 1 / -1; min-height: 0; }
.verdict { background: linear-gradient(135deg, var(--sea), #06506A); color: #fff; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.verdict h3 { font-size: 18px; }
.verdict p { margin: 0; opacity: .92; }
.foot { padding-block: 30px 50px; color: var(--muted); font-size: 12px; }
.foot a { color: var(--sea); }

/* full-screen sheets */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background: var(--bg); }
.topbar.float { position: absolute; left: 0; right: 0; background: none; }
.topbar h1 { font-size: 19px; }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.94); color: #062B3A; border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.2); text-decoration: none; cursor: pointer; flex: none; }
.step { margin-left: auto; background: rgba(6,43,58,.8); color: #fff; font-weight: 800; font-size: 13px; padding: 8px 12px; border-radius: 999px; }
.hero { position: relative; height: min(58vh, 480px); background: var(--c); overflow: hidden; }
.gal { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.gal::-webkit-scrollbar { display: none; }
.slide { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
.slide > img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.slide::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 24%, transparent 55%, rgba(0,0,0,.75)); }
.slide .ph { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; color: #fff; padding: 30px; background: linear-gradient(135deg, var(--c), #06283D); }
.slide .ph a { color: #fff; font-weight: 800; }
.cap { position: absolute; left: 16px; right: 16px; bottom: 40px; z-index: 2; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.cap b { display: block; font-size: 16px; line-height: 1.25; }
.cap small { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }
.dots { position: absolute; left: 0; right: 0; bottom: 34px; z-index: 3; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); transition: all .2s; }
.dots i.on { width: 20px; border-radius: 4px; background: #fff; }
.swipehint { position: absolute; right: 14px; top: calc(66px + env(safe-area-inset-top, 0px)); z-index: 3; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; display: flex; gap: 6px; align-items: center; }
.body { background: var(--bg); border-radius: 26px 26px 0 0; margin-top: -26px; position: relative; z-index: 2; padding-block: 22px 150px; display: flex; flex-direction: column; gap: 14px; }
.kind { display: inline-flex; gap: 6px; align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); background: var(--cs); padding: 5px 10px; border-radius: 999px; }
.body h1 { font-size: clamp(24px, 7vw, 30px); line-height: 1.1; }
.vn { color: var(--muted); font-size: 14px; margin-top: -8px; }
.timechip { display: inline-flex; align-items: baseline; gap: 10px; align-self: flex-start; background: var(--cs); border-radius: 14px; padding: 6px 12px; }
.timechip b { font-family: var(--f-d); font-size: 20px; font-variant-numeric: tabular-nums; }
.timechip span { font-size: 13px; font-weight: 700; color: var(--muted); }
.why { margin: 0; font-size: 17px; }
.h3 { font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; color: var(--sea); margin-bottom: 8px; }
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.list li { display: flex; gap: 10px; align-items: flex-start; }
.list li .ic { color: var(--sea); margin-top: 4px; }
.box { background: var(--warn-bg); color: var(--warn-ink); border-radius: 16px; padding: 12px 14px; }
.box .h3 { color: inherit; }
.box li .ic { color: var(--warn-ink); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.facts div.w { grid-column: 1 / -1; }
.facts span { font-size: 12px; color: var(--muted); font-weight: 700; }
.facts b { font-size: 15px; font-variant-numeric: tabular-nums; }
.src { font-size: 12px; color: var(--muted); }
.src a { color: var(--sea); word-break: break-word; }
.check { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 16px; padding: 12px 14px; font-weight: 800; cursor: pointer; min-height: 52px; }
.check[aria-pressed="true"] { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; padding: 14px 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--bg) 30%); }
.dock .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.dock .prev { flex: none; width: 56px; padding: 0; }
.dock .go { flex: 1.1; }
.dock .next { flex: 1.4; min-width: 0; justify-content: space-between; text-align: left; background: var(--ink); color: var(--bg); padding: 8px 12px; }
.dock .next .tx { display: flex; flex-direction: column; min-width: 0; }
.dock .next small { font-weight: 700; font-size: 11px; opacity: .75; }
.dock .next b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* map */
#lmap { height: calc(100vh - 170px); height: calc(100dvh - 170px); min-height: 360px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); z-index: 1; }
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 14px; overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; min-height: 42px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.mk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-d); font-weight: 700; font-size: 13px; color: #fff; background: var(--c); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.mk.home { background: #062B3A; }
.leaflet-popup-content { font-family: var(--f-b); margin: 12px 14px; }
.pop b { display: block; font-size: 15px; margin-bottom: 2px; }
.pop span { color: #4F6873; font-size: 13px; display: block; margin-bottom: 8px; }
.pop .row { gap: 6px; }
.pop .btn { min-height: 40px; font-size: 13px; padding: 8px 10px; flex: 1 1 auto; }
.pop .btn.line { color: #062B3A; background: #fff; }

/* text pages */
.tiles { display: flex; flex-direction: column; gap: 10px; padding-bottom: 50px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.tile p { margin: 0; color: var(--muted); font-size: 15px; }
.tile b.h { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.rank { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.rank:last-child { border-bottom: 0; }
.rank .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.rank .top b { font-size: 15px; }
.rank p { font-size: 14px; }
.v { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.v.must { background: var(--leaf-soft); color: var(--leaf); }
.v.can { background: var(--sea-soft); color: var(--sea); }
.v.no { background: var(--warn-bg); color: var(--warn-ink); }
.phr { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.phr:last-child { border-bottom: 0; }
.phr span { color: var(--muted); font-size: 14px; grid-row: span 2; align-self: center; }
.phr i { font-style: normal; color: var(--sun); font-weight: 700; font-size: 13px; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: #000; }
.lightbox .slide > img { object-fit: contain; cursor: zoom-out; }
.lightbox .slide::after { display: none; }
.lightbox .cap { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.lightbox .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 5; }
@media (prefers-reduced-motion: no-preference) { .sheet.enter { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>

  } else if (st.kind === "at") {
    const s = r.stops[st.i], q = sp(s), nx = r.stops[st.i + 1];
    h = `${st.i + 1}. ${esc(q.ru)}`; p = `До ${s.t1} — ещё ${fmtDur(st.left)}.${nx ? ` Дальше: ${esc(sp(nx).ru)}.` : " Потом домой."}`;
    bar = `<div class="bar"><b style="width:${st.pct}%"></b></div>`;
    act = `<div class="row"><a class="btn soft" href="${stopHref(st.i)}">Открыть точку</a>${nx ? `<a class="btn go" href="${sp(nx).nav}" target="_blank" rel="noopener">${ic("nav")}Дальше</a>` : `<a class="btn go" href="${DATA.home.nav}" target="_blank" rel="noopener">${ic("home")}Домой</a>`}</div>`;
  } else if (st.kind === "home-ride") {
    h = "Едем домой"; p = `${r.homeLeg.km} км, ~${r.homeLeg.min} мин. Отличный был день!`;
    act = `<a class="btn go" href="${DATA.home.nav}" target="_blank" rel="noopener">${ic("home")}Навигатор домой</a>`;
  } else { lbl = "День завершён"; h = "Спасибо, что катались с этим гидом"; p = "Маршрут остаётся здесь — можно повторить."; }
  return `<div class="now wrap"><div class="card" aria-live="polite"><div class="lbl"><i></i>${lbl}</div><h2>${h}</h2><p>${p}</p>${bar}${act}</div></div>`;
}

function curIndex(r) { const st = nowState(r); return (st.kind === "at" || st.kind === "ride") ? st.i : -1; }

function homeView() {
  const r = R(), cur = curIndex(r);
  const rc = DATA.routes.map(x => `<button class="rcard" style="--c:${x.color}" aria-pressed="${x.id === rid}" data-route="${x.id}">
      ${x.id === DATA.recommended ? `<span class="best">Советую</span>` : ""}
      <span class="tag">${esc(x.tag)}</span><b>${esc(x.name)}</b><p>${esc(x.short)}</p>
      <span class="meta"><span class="chip ${x.km <= DATA.safeKm ? "ok" : "warn"}">${ic("bolt")} ${x.km} км</span><span class="chip">${esc(x.budget)}</span></span></button>`).join("");
  const pct = Math.min(100, Math.round(100 * r.km / DATA.rangeKm));
  const batt = `<div class="batt" style="--c:${r.color}"><div class="top"><span>Заряд на этот маршрут</span><b>${r.km} из ${DATA.rangeKm} км</b></div>
      <div class="meter"><b style="width:${pct}%"></b><i style="left:${Math.round(100 * DATA.safeKm / DATA.rangeKm)}%"></i></div>
      <small>${esc(r.battNote)}</small></div>`;
  let rail = `<a class="item home-row" href="${DATA.home.nav}" target="_blank" rel="noopener" style="--c:#062B3A"><span class="t">${r.start}</span><span class="thumb">${ic("home")}</span><span class="n"><b>Старт от дома</b><span>${esc(DATA.home.name)}</span></span></a>`;
  r.stops.forEach((s, i) => {
    const q = sp(s), [c] = col(q), g = q.gallery[0];
    rail += `<div class="ride">${ic("bike")} ${s.km} км · ~${s.min} мин</div>
      <a class="item${done[rid + i] ? " done" : ""}${cur === i ? " cur" : ""}" href="${stopHref(i)}" style="--c:${c}">
        <span class="t">${s.t0}<small>до ${s.t1}</small></span>
        <span class="thumb">${g ? `<img src="${g.src}" alt="" loading="lazy">` : ic("pin")}<span class="num">${done[rid + i] ? "✓" : i + 1}</span></span>
        <span class="n"><b>${esc(q.ru)}</b><span>${esc(s.what || q.sub)}</span></span></a>`;
  });
  rail += `<div class="ride">${ic("bike")} ${r.homeLeg.km} км · ~${r.homeLeg.min} мин</div>
    <a class="item home-row" href="${DATA.home.nav}" target="_blank" rel="noopener" style="--c:#062B3A"><span class="t">${r.finish}</span><span class="thumb">${ic("home")}</span><span class="n"><b>Дома</b><span>Навигатор домой</span></span></a>`;
  return `<header class="cover"><img class="bg" src="${DATA.cover}" alt="">
    <div class="wrap in"><span class="eyebrow">${ic("bolt")}Суббота · 3 октября · электроскутер</span>
      <h1>Нячанг:<br><em>море, серпантин и закат</em></h1>
      <p>${esc(DATA.lead)}</p>
      <div class="stats"><div><b>${r.start}</b><span>старт</span></div><div><b>${r.finish}</b><span>дома</span></div><div><b>${r.km} км</b><span>за день</span></div><div><b>${r.stops.length}</b><span>точек</span></div></div></div></header>
  ${nowCard()}
  <div class="wrap">
    <section class="sec"><h2>Выберите маршрут</h2><p class="hint">Листайте карточки вбок. Все варианты — без храмов, в шортах и майках.</p><div class="routes">${rc}</div>${batt}</section>
    <section class="sec"><h2>${esc(r.name)}</h2><p class="hint">${esc(r.long)}</p><div class="rail">${rail}</div></section>
    <section class="sec"><div class="verdict"><h3>${ic("star")} Что выбрать</h3><p>${esc(DATA.recText)}</p></div></section>
    <section class="sec"><h2>Ещё</h2><div class="cards">
      <a class="tool" href="#map">${ic("map")}<b>Карта</b><span>Маршрут и все точки, нажимаются</span></a>
      <a class="tool" href="#rank">${ic("star")}<b>Рейтинг мест</b><span>Что обязательно, что можно, что нет</span></a>
      <a class="tool" href="#planb">${ic("rain")}<b>План Б</b><span>Ливень, волны, мало заряда</span></a>
      <a class="tool" href="#tips">${ic("bag")}<b>Перед выездом</b><span>Заряд, вещи, бюджет, фразы</span></a>
    </div></section>
    <p class="foot">${DATA.footer}</p>
  </div>`;
}

function slidesFor(q) {
  const g = q.gallery;
  if (!g.length) return `<div class="slide"><div class="ph"><div><p>${esc(q.ru)}</p><a href="${q.photos}" target="_blank" rel="noopener">Смотреть фото в Google Maps →</a></div></div></div>`;
  return g.map((x, k) => `<div class="slide"><img src="${x.src}" alt="${esc(x.cap)}" data-zoom="${q.id}:${k}" ${k ? 'loading="lazy"' : ""}><div class="cap"><b>${esc(x.cap)}</b><small>Фото: ${esc(x.credit)}</small></div></div>`).join("")
    + `<div class="slide"><div class="ph"><div><p>Больше свежих фото от посетителей</p><a href="${q.photos}" target="_blank" rel="noopener">Открыть в Google Maps →</a></div></div></div>`;
}

function stopView(i) {
  const r = R(), s = r.stops[i], q = sp(s), [c, cs] = col(q), nx = r.stops[i + 1];
  const n = q.gallery.length ? q.gallery.length + 1 : 1;
  const li = (a, icn) => a.map(x => `<li>${ic(icn)}<span>${esc(x)}</span></li>`).join("");
  const facts = [["Часы в субботу", q.hours], ["Цена", q.price], ["Сколько быть", q.stay], ["В дождь", q.rain]].filter(x => x[1]);
  const nextHTML = nx ? `<a class="btn next" href="${stopHref(i + 1)}"><span class="tx"><small>Дальше · ${nx.km} км · ${nx.t0}</small><b>${i + 2}. ${esc(sp(nx).ru)}</b></span>${ic("right")}</a>`
    : `<a class="btn next" href="${DATA.home.nav}" target="_blank" rel="noopener"><span class="tx"><small>Финиш · ${r.homeLeg.km} км</small><b>Домой</b></span>${ic("home")}</a>`;
  return `<div class="topbar float"><a class="round" href="#" aria-label="К маршруту">${ic("left")}</a><span class="step">${i + 1} из ${r.stops.length} · ${esc(r.tag)}</span><a class="round" href="#map" aria-label="Карта">${ic("map")}</a></div>
  <div class="hero" style="--c:${c}"><div class="gal">${slidesFor(q)}</div>${n > 1 ? `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k ? "" : "on"}"></i>`).join("")}</div><span class="swipehint">${ic("left")}листайте${ic("right")}</span>` : ""}</div>
  <div class="body wrap" style="--c:${c};--cs:${cs}">
    <span class="kind">${esc(q.kindRu)}</span>
    <h1>${esc(q.ru)}</h1><div class="vn">${esc(q.vn)}</div>
    <div class="timechip"><b>${s.t0}–${s.t1}</b><span>${fmtDur(toMin(s.t1) - toMin(s.t0))} · ${s.km} км от прошлой точки</span></div>
    <p class="why">${esc(q.why)}</p>
    ${s.note ? `<div class="tile" style="border-color:${c}"><p style="color:var(--ink)"><b>В этом маршруте:</b> ${esc(s.note)}</p></div>` : ""}
    ${q.do.length ? `<div><div class="h3">${ic("check")}Что делать</div><ul class="list">${li(q.do, "check")}</ul></div>` : ""}
    ${q.warn.length ? `<div class="box"><div class="h3">${ic("alert")}Подводные камни</div><ul class="list">${li(q.warn, "alert")}</ul></div>` : ""}
    <div class="facts">${facts.map(([k, v]) => `<div class="${String(v).length > 26 ? "w" : ""}"><span>${k}</span><b>${esc(v)}</b></div>`).join("")}<div class="w"><span>Адрес</span><b>${esc(q.addr)}</b></div></div>
    <div class="row"><a class="btn line" href="${q.search}" target="_blank" rel="noopener">${ic("pin")}Google Maps</a>${q.alt ? `<a class="btn line" href="${q.alt.url}" target="_blank" rel="noopener">${ic("search")}${esc(q.alt.label)}</a>` : ""}</div>
    <button class="check" aria-pressed="${!!done[rid + i]}" data-done="${rid + i}">${ic("check")}${done[rid + i] ? "Были здесь" : "Отметить: были здесь"}</button>
    <div class="src">Источники: ${q.sources.map(x => `<a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(" · ")}${q.unverified ? ` · <b>Не проверено:</b> ${esc(q.unverified)}` : ""}</div>
  </div>
  <nav class="dock"><div class="in"><a class="btn line prev" href="${i ? stopHref(i - 1) : "#"}" aria-label="Назад">${ic("left")}</a>
    <a class="btn go" href="${q.nav}" target="_blank" rel="noopener">${ic("nav")}Навигатор</a>${nextHTML}</div></nav>`;
}

let lmap = null, mapRoute = null;
function mapView() {
  const tabs = DATA.routes.map(x => `<button role="tab" aria-selected="${x.id === (mapRoute || rid)}" data-maptab="${x.id}">${esc(x.tag)}</button>`).join("");
  return `<div class="topbar"><a class="round" href="#" aria-label="Назад">${ic("left")}</a><h1>Карта маршрута</h1></div>
    <div class="wrap" style="display:flex;flex-direction:column;gap:10px;padding-bottom:20px"><div class="tabs" role="tablist">${tabs}</div><div id="lmap"></div>
    <p class="hint">Нажмите на кружок с номером: откроется название и кнопка навигатора.</p></div>`;
}
function drawMap() {
  if (!window.L) { document.getElementById("lmap").innerHTML = `<p style="padding:20px">Карта не загрузилась (нет интернета). Кнопки «Навигатор» на каждой точке работают.</p>`; return; }
  const r = DATA.routes.find(x => x.id === (mapRoute || rid));
  if (lmap) { lmap.remove(); lmap = null; }
  lmap = L.map("lmap", { zoomControl: true, attributionControl: true });
  const street = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Esri, © OpenStreetMap" }).addTo(lmap);
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Esri World Imagery" });
  L.control.layers({ "Схема": street, "Спутник": sat }, null, { position: "topright" }).addTo(lmap);
  const line = L.polyline(r.line, { color: "#fff", weight: 9, opacity: .9 }).addTo(lmap);
  L.polyline(r.line, { color: r.color, weight: 5 }).addTo(lmap);
  const icon = (t, c, cls = "") => L.divIcon({ className: "", html: `<div class="mk ${cls}" style="--c:${c}">${t}</div>`, iconSize: [34, 34], iconAnchor: [17, 17] });
  L.marker([DATA.home.lat, DATA.home.lng], { icon: icon("Д", "#062B3A", "home") }).addTo(lmap)
    .bindPopup(`<div class="pop"><b>Дом</b><span>${esc(DATA.home.name)}</span></div>`);
  r.stops.forEach((s, i) => {
    const q = sp(s), [c] = col(q);
    L.marker([q.lat, q.lng], { icon: icon(i + 1, c), zIndexOffset: 100 + i }).addTo(lmap)
      .bindPopup(`<div class="pop"><b>${i + 1}. ${esc(q.ru)}</b><span>${s.t0}–${s.t1} · ${esc(q.sub)}</span><div class="row">
        <a class="btn go" href="${q.nav}" target="_blank" rel="noopener">Навигатор</a>${r.id === rid ? `<a class="btn line" href="${stopHref(i)}">Открыть</a>` : ""}</div></div>`);
  });
  lmap.fitBounds(line.getBounds(), { padding: [24, 24] });
}

function rankView() {
  const V = { must: "обязательно", can: "можно", no: "не стоит" };
  return `<div class="topbar"><a class="round" href="#" aria-label="Назад">${ic("left")}</a><h1>Рейтинг мест</h1></div><div class="wrap tiles">
    <p class="hint">Честный вердикт по каждому месту, которое нашёл ресёрч. Всё сверено с часами работы в субботу.</p>
    ${DATA.ranking.map(c => `<div class="tile"><b class="h">${esc(c.cat)}</b>${c.items.map(x => `<div class="rank"><div class="top"><b>${esc(x.name)}</b><span class="v ${x.v}">${V[x.v]}</span></div><p style="margin:0;color:var(--muted)">${esc(x.note)}</p></div>`).join("")}</div>`).join("")}</div>`;
}
function textView(title, html) { return `<div class="topbar"><a class="round" href="#" aria-label="Назад">${ic("left")}</a><h1>${title}</h1></div><div class="wrap tiles">${html}</div>`; }
const tilesHTML = arr => arr.map(t => `<div class="tile"><b class="h">${ic(t.icon || "check")}${esc(t.h)}</b>${t.p ? `<p>${esc(t.p)}</p>` : ""}${t.kv ? t.kv.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("") : ""}${t.link ? `<a class="btn line" href="${t.link[1]}" target="_blank" rel="noopener">${ic("pin")}${esc(t.link[0])}</a>` : ""}</div>`).join("");

const app = document.getElementById("app");
let sheet = null;
function closeSheet() { if (sheet) { if (lmap) { lmap.remove(); lmap = null; } sheet.remove(); sheet = null; document.body.style.overflow = ""; } }
function openSheet(html) { closeSheet(); sheet = document.createElement("div"); sheet.className = "sheet enter"; sheet.innerHTML = html; document.body.appendChild(sheet); document.body.style.overflow = "hidden"; }
function render() { app.innerHTML = homeView(); }
function routeHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^([a-z]+)\/(\d+)$/);
  if (m && DATA.routes.some(r => r.id === m[1])) {
    if (m[1] !== rid) { rid = m[1]; store.set("nt2-route", rid); render(); }
    const i = Number(m[2]); if (i < R().stops.length) { openSheet(stopView(i)); return; }
  }
  if (h === "map") { openSheet(mapView()); drawMap(); }
  else if (h === "rank") openSheet(rankView());
  else if (h === "planb") openSheet(textView("План Б", tilesHTML(R().planB.concat(DATA.planB))));
  else if (h === "tips") openSheet(textView("Перед выездом", tilesHTML(DATA.tips) + `<div class="tile"><b class="h">${ic("chat")}Полезные фразы</b>${DATA.phrases.map(([a, b, c]) => `<div class="phr"><span>${esc(a)}</span><b>${esc(b)}</b><i>${esc(c)}</i></div>`).join("")}</div>`));
  else { closeSheet(); render(); }
}

document.addEventListener("click", e => {
  const rb = e.target.closest("[data-route]");
  if (rb) { rid = rb.dataset.route; store.set("nt2-route", rid); const x = window.scrollY; render(); window.scrollTo(0, x);
    const el = document.querySelector(`[data-route="${rid}"]`); if (el) el.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" }); return; }
  const mt = e.target.closest("[data-maptab]");
  if (mt) { mapRoute = mt.dataset.maptab; document.querySelectorAll("[data-maptab]").forEach(b => b.setAttribute("aria-selected", b === mt)); drawMap(); return; }
  const d = e.target.closest("[data-done]");
  if (d) { const k = d.dataset.done; done[k] = !done[k]; store.set("nt2-done", done); d.setAttribute("aria-pressed", !!done[k]); d.innerHTML = `${ic("check")}${done[k] ? "Были здесь" : "Отметить: были здесь"}`; render(); return; }
  const z = e.target.closest("[data-zoom]");
  if (z && !z.closest(".lightbox")) {
    const [id, k] = z.dataset.zoom.split(":"); const q = P[id];
    const lb = document.createElement("div"); lb.className = "lightbox";
    lb.innerHTML = `<button class="round close" aria-label="Закрыть">${ic("x")}</button><div class="gal">${q.gallery.map(g => `<div class="slide"><img src="${g.src}" alt="${esc(g.cap)}" data-close="1"><div class="cap"><b>${esc(g.cap)}</b><small>Фото: ${esc(g.credit)}</small></div></div>`).join("")}</div>`;
    document.body.appendChild(lb); const gal = lb.querySelector(".gal"); gal.scrollLeft = Number(k) * gal.clientWidth; return;
  }
  if (e.target.closest(".lightbox .close") || e.target.closest(".lightbox [data-close]")) e.target.closest(".lightbox").remove();
});
document.addEventListener("scroll", e => {
  const g = e.target; if (!(g instanceof Element) || !g.classList.contains("gal")) return;
  const k = Math.round(g.scrollLeft / g.clientWidth);
  g.parentElement.querySelectorAll(".dots i").forEach((d, j) => d.classList.toggle("on", j === k));
  const hint = g.parentElement.querySelector(".swipehint"); if (hint && k > 0) hint.remove();
}, true);
window.addEventListener("hashchange", routeHash);
routeHash();
setInterval(() => { if (!sheet) { const x = window.scrollY; render(); window.scrollTo(0, x); } }, 60000);
</script>
</body>
</html>
