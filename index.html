<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Нячанг на скутере</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-height column. Home = cover + "now" card + tide-like day rail (sun → dusk);
   each stop opens as a full-screen sheet with a sticky action bar. */
:root {
  --bg: #F6F1E8;        /* warm sand */
  --surface: #FFFFFF;
  --ink: #0B2B36;       /* deep sea */
  --muted: #4E6670;
  --line: #E4DCCD;
  --sun: #E8590C;       /* day / south */
  --sea: #0B7A8C;       /* north coast */
  --dusk: #5145CD;      /* evening */
  --sun-soft: #FFE7D6;
  --sea-soft: #D9F1F3;
  --dusk-soft: #E7E5FB;
  --warn-bg: #FFF2E2; --warn-ink: #9A3A06;
  --cover-ink: #FFFFFF;
  --shadow: 0 6px 24px rgba(11,43,54,.12);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C1A20; --surface: #13262E; --ink: #EAF4F5; --muted: #9DB4BB; --line: #24404A;
  --sun: #FF8A3D; --sea: #3CC4D6; --dusk: #9A92FF;
  --sun-soft: #3A2316; --sea-soft: #12343B; --dusk-soft: #24224A;
  --warn-bg: #3A2614; --warn-ink: #FFC08A; --shadow: 0 6px 24px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C1A20; --surface: #13262E; --ink: #EAF4F5; --muted: #9DB4BB; --line: #24404A;
  --sun: #FF8A3D; --sea: #3CC4D6; --dusk: #9A92FF;
  --sun-soft: #3A2316; --sea-soft: #12343B; --dusk-soft: #24224A;
  --warn-bg: #3A2614; --warn-ink: #FFC08A; --shadow: 0 6px 24px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.ic { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }

/* ---------- cover ---------- */
.cover { position: relative; color: var(--cover-ink); background: #0B2B36; overflow: hidden; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,25,32,.15) 0%, rgba(5,25,32,.55) 55%, rgba(5,25,32,.92) 100%); }
.cover .in { position: relative; z-index: 1; padding-block: 92px 22px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-weight: 800; font-size: 13px;
  letter-spacing: .04em; text-transform: uppercase; background: var(--sun); color: #fff; padding: 6px 12px; border-radius: 999px; }
.cover h1 { font-size: clamp(30px, 8.6vw, 42px); line-height: 1.05; font-weight: 800; }
.cover p { margin: 0; font-size: 16px; opacity: .92; max-width: 34ch; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.stats div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 14px; padding: 8px 4px; text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; opacity: .85; }

/* ---------- now card ---------- */
.now { margin-top: -14px; position: relative; z-index: 2; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);
  padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.now .lbl { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.now .lbl i { width: 9px; height: 9px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.now h2 { font-size: 20px; line-height: 1.2; }
.now p { margin: 0; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--sun); border-radius: 3px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 16px; border-radius: 16px;
  font-weight: 800; font-size: 16px; text-decoration: none; border: 0; cursor: pointer; }
.btn.go { background: var(--sun); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.btn.soft { background: var(--sea-soft); color: var(--ink); }
.btn.line { background: var(--surface); border: 1.5px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.row > .btn.go { flex: 2 1 180px; }
.row > .pinbtn { flex: 1 0 auto; }

/* ---------- sections ---------- */
.sec { padding-block: 26px 4px; display: flex; flex-direction: column; gap: 12px; }
.sec h2 { font-size: 22px; }
.sec .hint { margin: -4px 0 2px; color: var(--muted); font-size: 14px; }

/* day rail: sun at the top, dusk at the bottom */
.rail { position: relative; display: flex; flex-direction: column; gap: 0; padding-left: 22px; }
.rail::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 18px; width: 4px; border-radius: 2px;
  background: linear-gradient(180deg, var(--sun) 0%, var(--sun) 40%, var(--sea) 58%, var(--dusk) 75%, var(--dusk) 100%); }
.part { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 0 6px; }
.ride { font-size: 13px; color: var(--muted); padding: 6px 0 6px 6px; display: flex; gap: 6px; align-items: center; }
.item { position: relative; display: grid; grid-template-columns: 50px 56px 1fr; gap: 12px; align-items: center; text-decoration: none;
  background: var(--surface); border-radius: 18px; padding: 10px 12px 10px 10px; border: 1px solid var(--line); min-height: 64px; cursor: pointer; }
.item::before { content: ""; position: absolute; left: -20px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
  background: var(--c); border: 3px solid var(--bg); }
.item .t { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.item .t small { display: block; font-family: var(--f-body); font-weight: 600; font-size: 12px; color: var(--muted); margin-top: 3px; }
.item .n { display: flex; flex-direction: column; min-width: 0; }
.item .n b { font-size: 16px; line-height: 1.2; }
.item .n span { font-size: 13px; color: var(--muted); }
.item .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700;
  font-size: 14px; color: #fff; background: var(--c); }
.item.done { opacity: .55; }
.item.done .num { background: var(--muted); }
.item.cur { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); }
.home-row { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.home-row .t small, .home-row .n span { color: inherit; opacity: .75; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-decoration: none; display: flex;
  flex-direction: column; gap: 6px; min-height: 108px; cursor: pointer; }
.card b { font-size: 16px; }
.card span { font-size: 13px; color: var(--muted); }
.card .ic { width: 26px; height: 26px; color: var(--sea); }
.card.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
.foot { padding-block: 28px 40px; color: var(--muted); font-size: 12px; }

/* ---------- full-screen sheets ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: env(safe-area-inset-top, 0px); }
.sheet[hidden] { display: none !important; }
.topbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.topbar.float { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.92); color: #0B2B36;
  border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.2); text-decoration: none; cursor: pointer; }
.step { margin-left: auto; background: rgba(11,43,54,.78); color: #fff; font-weight: 800; font-size: 13px; padding: 8px 12px; border-radius: 999px; }
.hero { position: relative; height: min(56vh, 460px); background: var(--c); overflow: hidden; }
.gal { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.gal::-webkit-scrollbar { display: none; }
.slide { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
.slide > img, .slide .mapbox, .slide .mapbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide > img { cursor: zoom-in; }
.slide::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,.72)); }
.cap { position: absolute; left: 16px; right: 16px; bottom: 34px; z-index: 2; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.cap b { display: block; font-size: 17px; line-height: 1.25; }
.cap small { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }
.dots { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 3; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); transition: all .2s; }
.dots i.on { width: 20px; border-radius: 4px; background: #fff; }
.count { position: absolute; right: 14px; bottom: 30px; z-index: 3; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 800;
  padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.swipehint { position: absolute; right: 14px; top: 64px; z-index: 3; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px; display: flex; gap: 6px; align-items: center; }
.timechip { display: inline-flex; align-items: baseline; gap: 10px; align-self: flex-start; background: var(--cs); color: var(--ink); border-radius: 14px; padding: 6px 12px; }
.timechip b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.timechip span { font-size: 13px; font-weight: 700; color: var(--muted); }
.lightbox { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; }
.lightbox .gal .slide > img { object-fit: contain; cursor: zoom-out; }
.lightbox .slide::after { display: none; }
.lightbox .cap { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.lightbox .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 5; }
.thumb { width: 56px; height: 56px; border-radius: 14px; overflow: hidden; position: relative; flex: none; background: var(--c); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .num { position: absolute; left: -2px; bottom: -2px; width: 24px !important; height: 24px !important; font-size: 12px !important; border: 2px solid var(--surface); }
.hero .time { display: none;
  display: flex; align-items: baseline; gap: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.hero .time b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.hero .time span { font-size: 13px; font-weight: 700; color: #4E6670; }
.body { background: var(--bg); border-radius: 24px 24px 0 0; margin-top: -22px; position: relative; z-index: 2;
  padding-block: 20px 140px; display: flex; flex-direction: column; gap: 14px; }
.kind { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: var(--c); background: var(--cs); padding: 5px 10px; border-radius: 999px; }
.body h1 { font-size: clamp(24px, 7vw, 30px); line-height: 1.1; }
.body .vn { color: var(--muted); font-size: 14px; margin-top: -6px; }
.what { margin: 0; font-size: 17px; }
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.list li { display: flex; gap: 10px; align-items: flex-start; }
.list li .ic { color: var(--sea); margin-top: 3px; }
.box { background: var(--warn-bg); color: var(--warn-ink); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.box h3, .h3 { font-family: var(--f-body); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.box li .ic { color: var(--warn-ink); }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prices div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; }
.prices span { font-size: 12px; color: var(--muted); font-weight: 700; }
.prices b { font-size: 16px; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 16px;
  padding: 12px 14px; font-weight: 800; cursor: pointer; min-height: 52px; }
.check[aria-pressed="true"] { border-style: solid; border-color: var(--sea); background: var(--sea-soft); }
.minimap { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }

/* sticky bottom action bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(0,0,0,0), var(--bg) 26%); }
.dock .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.dock .prev { flex: none; width: 56px; }
.dock .next { flex: 1; min-width: 0; justify-content: space-between; text-align: left; background: var(--ink); color: var(--bg); }
.dock .next .tx { display: flex; flex-direction: column; min-width: 0; }
.dock .next small { font-weight: 700; font-size: 12px; opacity: .75; }
.dock .next b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* maps */
.mapbox { position: relative; width: 100%; }
.mapbox img { width: 100%; display: block; }
.pin { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 14px; color: #fff; background: var(--c); border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.35); text-decoration: none; cursor: pointer; }
.pin.home { background: #0B2B36; font-size: 12px; }
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 14px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; min-height: 44px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.mapframe { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 5px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.pagehead { display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; }
.pagehead h1 { font-size: 22px; }
.tiles { display: flex; flex-direction: column; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.tile p { margin: 0; color: var(--muted); font-size: 15px; }
.tile b.h { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.kv:last-child { border-bottom: 0; }
.kv b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.phr { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.phr:last-child { border-bottom: 0; }
.phr span { color: var(--muted); font-size: 14px; grid-row: span 2; align-self: center; }
.phr i { font-style: normal; color: var(--sun); font-weight: 700; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet.enter { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

function vnNow() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const g = t => parts.find(p => p.type === t).value;
  return { date: `${g("year")}-${g("month")}-${g("day")}`, min: Number(g("hour")) * 60 + Number(g("minute")) };
}

function nowState() {
  const n = vnNow();
  if (n.date < DATA.date) return { kind: "before-day" };
  if (n.date > DATA.date) return { kind: "after" };
  const m = n.min;
  if (m < toMin(DATA.start)) return { kind: "before", left: toMin(DATA.start) - m };
  for (let i = 0; i < S.length; i++) {
    const s = S[i], a = toMin(s.t0), b = toMin(s.t1);
    if (m < a) return { kind: "ride", to: s, eta: s.t0, i };
    if (m <= b) return { kind: "at", s, left: b - m, pct: Math.round(100 * (m - a) / Math.max(1, b - a)), i };
  }
  if (m < toMin(DATA.finish)) return { kind: "home-ride" };
  return { kind: "after" };
}

function nowCard() {
  const st = nowState();

    p = `Первая точка — ${esc(first.ru)}, ${first.leg.km} км (~${first.leg.min} мин). Возьмите купальники, крем и наличные.`;
    act = `<a class="btn go" href="${first.nav}" target="_blank" rel="noopener">${ic("nav")}Навигатор к первой точке</a>`;
  } else if (st.kind === "before") {
    h = `До старта ${fmtDur(st.left)}`;
    p = `В 11:00 выезжаем на юг, к точке «${esc(first.ru)}».`;
    act = `<a class="btn go" href="${first.nav}" target="_blank" rel="noopener">${ic("nav")}Навигатор к первой точке</a>`;
  } else if (st.kind === "ride") {
    lbl = "Сейчас — в дороге";
    h = `Едем к ${st.to.id}. ${esc(st.to.ru)}`;
    p = `Прибытие по плану в ${st.to.t0}. ${st.to.leg.km} км, ~${st.to.leg.min} мин.`;
    act = `<div class="row"><a class="btn go" href="${st.to.nav}" target="_blank" rel="noopener">${ic("nav")}Навигатор</a><a class="btn soft" href="#s${st.to.id}">Открыть точку</a></div>`;
  } else if (st.kind === "at") {
    h = `${st.s.id}. ${esc(st.s.ru)}`;
    p = `По плану здесь до ${st.s.t1} — ещё ${fmtDur(st.left)}.`;
    bar = `<div class="bar"><b style="width:${st.pct}%"></b></div>`;
    const nx = S[st.i + 1];
    act = `<div class="row"><a class="btn soft" href="#s${st.s.id}">Открыть точку</a>${nx ? `<a class="btn go" href="${nx.nav}" target="_blank" rel="noopener">${ic("nav")}Дальше: ${nx.id}</a>` : ""}</div>`;
  } else if (st.kind === "home-ride") {
    lbl = "Сейчас — домой"; h = "Едем домой"; p = `${DATA.homeLeg.km} км, ~${DATA.homeLeg.min} мин.`;
    act = `<a class="btn go" href="${DATA.home.nav}" target="_blank" rel="noopener">${ic("home")}Навигатор домой</a>`;
  } else {
    lbl = "День завершён"; h = "Вы прошли весь маршрут"; p = "Отдыхайте. Гид можно открыть снова в любой момент.";
  }
  return `<section class="now" aria-live="polite"><div class="lbl"><i></i>${lbl}</div><h2>${h}</h2><p>${p}</p>${bar}${act}</section>`;
}

function mapHTML(m, small) {
  const pins = m.pins.map(p => {
    const [c] = PART[p.part];
    const href = p.id === "home" ? DATA.home.nav : (small ? S.find(s => s.id === p.id).nav : `#s${p.id}`);
    const ext = p.id === "home" || small ? ` target="_blank" rel="noopener"` : "";
    return `<a class="pin${p.id === "home" ? " home" : ""}" href="${href}"${ext} style="left:${p.x}%;top:${p.y}%;--c:${c}" aria-label="${esc(p.label)}">${p.id === "home" ? "Д" : p.id}</a>`;
  }).join("");
  return `<div class="mapbox" style="aspect-ratio:${m.w}/${m.h}"><img src="${m.src}" alt="Карта" loading="lazy">${pins}</div>`;
}

  </div>
  <nav class="dock"><div class="in">
    <a class="btn line prev" href="${prev ? "#s" + prev.id : "#"}" aria-label="${prev ? "Предыдущая точка" : "К маршруту"}">${ic("left")}</a>${nextHTML}
  </div></nav>`;
}

function pageHead(title) {
  return `<div class="topbar"><a class="round" href="#" aria-label="Назад к маршруту">${ic("left")}</a><h1 style="font-size:20px">${title}</h1></div>`;
}

function mapView(tab) {
  const t = tab || "all";
  const tabs = [["all", "Весь день"], ["south", "Юг"], ["city", "Город и север"]];
  return `${pageHead("Карта дня")}<div class="wrap" style="display:flex;flex-direction:column;gap:12px;padding-bottom:40px">
    <div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button role="tab" id="tab-${k}" aria-selected="${k === t}" data-tab="${k}">${n}</button>`).join("")}</div>
    <div class="mapframe">${mapHTML(DATA.maps[t], false)}</div>
    <div class="legend"><span><i style="background:var(--sun)"></i>День: юг и север</span><span><i style="background:var(--dusk)"></i>Вечер</span></div>
    <p class="hint" style="color:var(--muted);margin:0">Нажмите на номер — откроется экран точки с кнопкой навигатора.</p></div>`;
}

const TIPS = `
  <div class="tile"><b class="h">${ic("bag")}Взять с собой</b><p>Купальники, полотенце, крем SPF 50, шляпы, воду, дождевик (с 15 до 17 возможен короткий дождь), пакет для телефонов, наличные мелкими.</p></div>
  <div class="tile"><b class="h">${ic("bike")}Скутер</b><p>Залейте полный бак до выезда на юг — за день почти 100 км. Шлемы на обоих (штраф 400–600 тыс.). Права: национальные + международные с категорией A, иначе штраф 2–4 млн. Алкоголь за рулём нельзя совсем.</p></div>
  <div class="tile"><b class="h">${ic("clock")}Погода и солнце</b><p>+25…30 °C, днём очень сильное солнце (УФ до 12). Закат 17:32, темно к 17:55 — назад по городу едем уже с фарами.</p></div>
  <div class="tile"><b class="h">${ic("money")}Бюджет на двоих</b>
    <div class="kv"><span>Бензин и парковки</span><b>130–160 тыс.</b></div>
    <div class="kv"><span>Обед у моря</span><b>400–700 тыс.</b></div>
    <div class="kv"><span>Хон Чонг (вход)</span><b>60 тыс.</b></div>
    <div class="kv"><span>Кокосы, соки, снеки</span><b>100–150 тыс.</b></div>
    <div class="kv"><span>Skylight с напитками</span><b>300 тыс.</b></div>
    <div class="kv"><span>Ужин</span><b>300–600 тыс.</b></div>
    <div class="kv"><span>Напитки в Marina Beach Club</span><b>200–500 тыс.</b></div>
    <div class="kv"><span><b>Итого</b></span><b>≈ 1,5–2,4 млн</b></div></div>`;

const PLANB = `
  <div class="tile"><b class="h">${ic("rain")}Сильный дождь</b><p>Переждите 30–60 минут в ближайшем кафе — ливни в октябре короткие. Если льёт долго: Океанографический музей (акулы, черепахи, скелет кита; 40 тыс., до 18:00) — в южном конце набережной.</p></div>
  <div class="tile"><b class="h">${ic("alert")}На Бай Зай волны или мусор</b><p>Спокойная бухта Нью Тьен — 80 тыс., лежаки и душ, по пути обратно в город.</p><a class="btn line" href="https://www.google.com/maps/search/?api=1&query=12.1742%2C109.2056" target="_blank" rel="noopener">${ic("pin")}Нью Тьен на карте</a></div>
  <div class="tile"><b class="h">${ic("clock")}Опаздываете</b><p>Сократите пляж или пропустите морскую дорогу (точка 5). Главное — быть на крыше Skylight к 17:15, к закату.</p></div>
  <div class="tile"><b class="h">${ic("bike")}Хочется активнее</b><p>Вместо крыши — подъём на гору Ко Тьен (первая вершина, 30–45 мин вверх по открытой тропе). Лучший закат в городе, но спуск в сумерках с фонариками и только по сухой тропе.</p><a class="btn line" href="https://www.google.com/maps/search/?api=1&query=12.29198%2C109.19567" target="_blank" rel="noopener">${ic("pin")}Начало тропы</a></div>
  <div class="tile"><b class="h">${ic("map")}Есть лишний час</b><p>Скалы и пещеры Ханг Хео с кофейней над заливом Нья Фу — 16 км на север по той же морской дороге. Обувь не скользкую.</p><a class="btn line" href="https://www.google.com/maps/search/?api=1&query=12.32943%2C109.21019" target="_blank" rel="noopener">${ic("pin")}Ханг Хео на карте</a></div>
  <div class="tile"><b class="h">${ic("clock")}Не хочется домой в 21:00</b><p>По субботам после 21:00 — вечеринка на пляже Sailing Club (вход 150–250 тыс. с напитком).</p></div>`;

const PHRASES = [["Сколько стоит?", "Bao nhiêu tiền?", "бао нье-у тьен"], ["Сколько за 1 кг?", "Bao nhiêu 1 ký?", "бао нье-у мот ки"],
  ["Счёт, пожалуйста", "Tính tiền", "тинь тьен"], ["Не острое", "Không cay", "хонг кай"], ["Спасибо", "Cảm ơn", "кам он"], ["Парковка", "Gửi xe", "гуй се"]];

const TEMPLES = `
  <div class="tile"><p>Эти места красивые, но туда пускают только с закрытыми плечами и коленями. Соберу по ним отдельный маршрут на день, когда будете готовы так одеться.</p></div>
  <div class="tile"><b class="h">${ic("temple")}В отдельный гид</b>
    <div class="kv"><span>Пагода Лонг Шон и Белый Будда</span><b>днём</b></div>
    <div class="kv"><span>Башни По Нагар</span><b>до ~17:30</b></div>
    <div class="kv"><span>Каменный собор</span><b>14:00–16:30</b></div>
    <div class="kv"><span>Пагода на островке Хон До</span><b>до 16:30</b></div>
    <div class="kv"><span>Виллы Бао Дая</span><b>только будни</b></div></div>`;

function textView(title, html) {
  return `${pageHead(title)}<div class="wrap tiles" style="padding-bottom:40px">${html}</div>`;
}

const app = document.getElementById("app");
let sheet = null;

function closeSheet() { if (sheet) { sheet.remove(); sheet = null; document.body.style.overflow = ""; } }
function openSheet(html) {
  closeSheet();
  sheet = document.createElement("div");
  sheet.className = "sheet enter";
  sheet.innerHTML = html;
  document.body.appendChild(sheet);
  document.body.style.overflow = "hidden";
  sheet.scrollTop = 0;
}

let mapTab = "all";
function route() {
  const h = location.hash.replace("#", "");
  const m = h.match(/^s(\d+)$/);
  if (m && S.some(s => s.id === Number(m[1]))) openSheet(stopView(Number(m[1])));
  else if (h === "map") openSheet(mapView(mapTab));
  else if (h === "tips") openSheet(textView("Перед выездом", TIPS));
  else if (h === "planb") openSheet(textView("План Б", PLANB));
  else if (h === "phrases") openSheet(textView("6 полезных фраз", `<div class="tile">${PHRASES.map(([a, b, c]) => `<div class="phr"><span>${a}</span><b>${b}</b><i>${c}</i></div>`).join("")}</div>`));
  else if (h === "temples") openSheet(textView("День храмов", TEMPLES));
  else { closeSheet(); app.innerHTML = homeView(); }
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-done]");
  if (d) { const id = d.dataset.done; done[id] = !done[id]; saveDone(); d.setAttribute("aria-pressed", !!done[id]);
    d.innerHTML = `${ic("check")}${done[id] ? "Были здесь" : "Отметить: были здесь"}`; app.innerHTML = homeView(); return; }
  const t = e.target.closest("[data-tab]");
  if (t) { mapTab = t.dataset.tab; openSheet(mapView(mapTab)); }
});

// gallery dots follow the scroll position
document.addEventListener("scroll", e => {
  const g = e.target;
  if (!(g instanceof Element) || !g.classList.contains("gal")) return;
  const k = Math.round(g.scrollLeft / g.clientWidth);
  const dots = g.parentElement.querySelectorAll(".dots i");
  dots.forEach((d, j) => d.classList.toggle("on", j === k));
  const hint = g.parentElement.querySelector(".swipehint"); if (hint && k > 0) hint.remove();
}, true);

// full-screen photo viewer
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (z && !z.closest(".lightbox")) {
    const [id, k] = z.dataset.zoom.split(":").map(Number);
    const s = S.find(x => x.id === id);
    const lb = document.createElement("div");
    lb.className = "lightbox";
    lb.innerHTML = `<button class="round close" aria-label="Закрыть">${ic("x")}</button><div class="gal">${s.gallery.map(g =>
      `<div class="slide"><img src="${g.src}" alt="${esc(g.cap)}" data-close="1"><div class="cap"><b>${esc(g.cap)}</b><small>Фото: ${esc(g.credit)}</small></div></div>`).join("")}</div>`;
    document.body.appendChild(lb);
    const gal = lb.querySelector(".gal"); gal.scrollLeft = k * gal.clientWidth;
    return;
  }
  if (e.target.closest(".lightbox .close") || e.target.closest(".lightbox [data-close]")) e.target.closest(".lightbox").remove();
});

// swipe left/right between stops (not when swiping photos)
let sx = null, sy = null;
document.addEventListener("touchstart", e => { if (!sheet || e.target.closest(".gal, .lightbox")) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  const m = location.hash.match(/^#s(\d+)$/);
  if (!m || Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
  const i = S.findIndex(s => s.id === Number(m[1]));
  const to = dx < 0 ? S[i + 1] : S[i - 1];
  location.hash = to ? "s" + to.id : "";
}, { passive: true });

window.addEventListener("hashchange", route);
route();
setInterval(() => { if (!sheet) app.innerHTML = homeView(); }, 60000);
</script>
</body></html>
